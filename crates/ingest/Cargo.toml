[package]
name = "osu-ingest"
description = "The local ingest binary: the library's game folders in, the index and R2 objects out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
osu-core.workspace = true
rayon.workspace = true
rosu-map = "0.2.1"
rosu-mods = { version = "0.4.1", features = ["serde"] }
rosu-pp = "4.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# SigV4 for the R2 upload (`r2.rs`). Both RustCrypto, neither with C.
hmac = "0.12"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
toml = "1"
ureq = { version = "3.4.2", features = ["json"] }
