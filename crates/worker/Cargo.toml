[package]
name = "osu-worker"
description = "Thin workers-rs adapter. Plumbing only; logic belongs in corner-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker.workspace = true
serde.workspace = true
serde_json.workspace = true
corner-core.workspace = true
# For the profile projection. `osu-core` is pure data and wasm32-clean by design, so the Worker can
# hold it; the projection lives there because `osu-ingest` publishes the same shape.
osu-core.workspace = true
