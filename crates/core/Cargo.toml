[package]
name = "corner-core"
description = "Runtime-agnostic cache logic. No I/O, no runtime, no bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Stays empty on purpose: a dependency here means the code belongs in an adapter crate
# instead. In particular this crate must never depend on `worker` — see the crate docs.
[dependencies]

# Test-only, and it must stay test-only: the point of this crate is that it has no runtime. This is
# a `block_on` and nothing else, so the async tests need no executor, no wasm and no network.
[dev-dependencies]
pollster = "0.4"
