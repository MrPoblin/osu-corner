<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Not found</title>
    <!--
      Served by the assets router for any unmatched path (`not_found_handling = "404-page"`).

      **Temporary.** The corner is meant to borrow poblin.live's own 404 rather than own a page of its
      own, and until it is mounted under that domain this sends the visitor to osu! instead of showing
      a hand-rolled screen nobody asked for. Change the two URLs in this file to repoint it.
    -->
    <meta http-equiv="refresh" content="0; url=https://osu.ppy.sh/" />
  </head>
  <body>
    <p>Not found. <a href="https://osu.ppy.sh/">Continue to osu!</a></p>
  </body>
</html>
