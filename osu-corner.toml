# Everything a clone changes. Secrets are not here — see .dev.vars.example.

[site]
name = "osu! corner"
# The mount path is not here: it has to be Vite's `base`, so it lives in
# apps/corner/vite.config.ts, and the route in wrangler.toml must agree with it.

# The account this corner belongs to. `id` is what the profile route fetches. `names` is the
# whitelist ingest uses for replays — a replay keeps the name it was played under, so a rename
# means a new alias. Ingest reports replays that matched nothing, so a missing one shows up.
#
# Several [[user]] blocks are supported, for a collection holding more than one player.
[[user]]
id = 31220620
names = ["Poblin"]

[r2]
# Where the .osr files are served from, and the bucket they upload to. Both matter only once
# ingest runs; the bucket must exist and be reachable at `host` first.
host = ""
bucket = ""

[mirrors]
# Tried in order, for the two things this project does not host: the .osu file and the audio.
# Must match the CSP in apps/corner/public/_headers.
urls = ["https://osu.direct", "https://catboy.best"]
