# Committed defaults, and deliberately nothing personal.
#
# Your own values go in `osu-corner.local.toml` beside this file, which is gitignored. It is
# merged over this one when the config loads: tables merge key by key, and arrays are replaced
# wholesale — so a `[[source]]` list there replaces the example below rather than joining it.
#
# Keeping personal values out of this file is what lets a fresh clone build and deploy untouched.
# A path from somebody's machine is wrong for everybody else, so it is not a default at all.

[site]
name = "osu! corner"
# The mount path is not here: it has to be Vite's `base`, so it lives in
# apps/corner/vite.config.ts, and the route in wrangler.toml must agree with it.

[storage]
# Where the .osr files and the index are served from, and the bucket they upload to. All of it
# matters only once ingest runs, and an empty `public_base` or `bucket` means "no bucket yet" — a
# supported state, not a failure: the objects stay in `library/` and the run reports them as not
# uploaded.
#
# `public_base` is the URL the browser fetches the index and the replays from. It is substituted into
# the CSP at build time and injected into the frontend as the index's base URL, so this is the only
# place the value lives. It is deliberately not a static asset of this repository: the index is the
# owner's data, so it travels through the bucket, and a play reaches the site on the next ingest
# rather than the next deploy.
public_base = ""
bucket = ""
# The **S3 API** endpoint uploads are signed against. Deliberately not `public_base`: one is an API,
# the other a URL. Any S3-compatible service works — `https://s3.<region>.backblazeb2.com` for
# Backblaze B2, `https://<account>.r2.cloudflarestorage.com` for Cloudflare R2, or MinIO, Storj,
# Wasabi. The access key pair is a secret and lives in `.dev.vars`
# (STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY), never in this file.
endpoint = ""
# The **SigV4 region**. `auto` is Cloudflare R2's, and an empty value means `auto`, so a config
# written before this field existed keeps working. Backblaze B2 wants its own: the middle segment of
# the endpoint, e.g. `us-west-004` from `s3.us-west-004.backblazeb2.com`. A wrong region fails as a
# bare `403` with no explanation, which is why this is a value rather than a constant.
region = ""

[mirrors]
# Tried in order, for the two things this project does not host: the .osu file and the audio.
# Must match the CSP in apps/corner/public/_headers.
#
# A bare string is a mirror that serves `{base}/osu/{id}` and cannot look a beatmap up by checksum.
# A table names its own routes when they differ, and claims `md5` when it can turn a checksum into a
# beatmap id — and **that hop is what makes a map no install holds reachable at all**, so a list in
# which nothing claims it fetches no such maps and says so rather than reporting them as deleted.
#
# The first entry goes first because it is the one that resolves, and because it aggregates the
# others: one endpoint racing eight sources, with circuit breakers. It is still not the whole list,
# for two reasons it documents itself — its cascade deliberately excludes catboy.best (out of
# respect for its maintainer) and Nerinyan (which consumes that cascade), so some maps are
# reachable only through the mirrors below it; and it is a single machine, so it does not survive
# losing it. A cascade protects against a mirror's upstreams failing, not against the mirror.
urls = [
  # Routes verified against the live service: the raw .osu sits at `/api/osu/{id}` — the `/osu/{id}`
  # every other mirror uses answers 404 here — and the checksum hop uses the batch route, which
  # separates "does not hold it" from "could not answer right now". The single-MD5 route collapses
  # those into one bare 404, and recording the second as the first would stop this project ever
  # asking again.
  { url = "https://mirror.hinamizawa.ai", osu = "/api/osu/{id}", md5 = "/v3/osu/beatmaps/batch?md5={md5}" },
  "https://osu.direct",
  "https://catboy.best",
]

# ---------------------------------------------------------------------------------------------
# In osu-corner.local.toml, in this shape:
#
#   [[source]]
#   kind    = "lazer"                       # or "stable"
#   path    = "/path/to/your/osu-lazer"     # lazer: the folder holding client.realm and files/
#   enabled = true
#
#   [[source]]
#   kind    = "stable"                      # Songs/ + Scores.db + Data/r/
#   path    = "/path/to/your/osu"           # stable: the folder holding osu!.db and Songs/
#   enabled = true
#
#   [[user]]
#   id    = 0                               # your numeric osu! id, for the profile route
#   names = ["YourName"]                    # every name the account has played under
#
# A disabled source is never opened, so pointing at an uninstalled game is harmless. An enabled
# source whose root is missing is a hard error, which is the difference between "off on purpose"
# and "silently contributing nothing".
