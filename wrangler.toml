name = "osu-corner"
compatibility_date = "2025-04-01"

# `run_worker_first` is an option of `[assets]`, not a top-level field. It lives down there
# because at the top level wrangler only warns — "Unexpected fields found in top-level field" —
# and silently ignores it, which is how it spent its whole life not applying.
main = "crates/worker/build/index.js"

# No route yet: this publishes to osu-corner.<account>.workers.dev. The route onto a real
# domain is attached later, and must match `base` in apps/corner/vite.config.ts.
workers_dev = true
preview_urls = true

[assets]
# The asset root. The app builds nested under its mount path — see vite.config.ts.
directory = "apps/corner/dist"
not_found_handling = "404-page"
# Keeps the assets router first for everything except /api/*, so a static request never invokes
# the script or counts against the daily request budget.
run_worker_first = ["/api/*"]
